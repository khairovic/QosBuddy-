# QoSBuddy M6 — Docker Compose Stack
services:
  # ── 1. Ollama — local LLM server ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: qosbuddy-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # ── 2. KB builder — runs once then exits ──────────────────────────────────
  kb-builder:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qosbuddy-kb-builder
    command: >
      sh -c "
        echo 'Waiting 20s for Ollama...' &&
        sleep 20 &&
        python rag/build_knowledge_base.py
      "
    environment:
      - QOSBUDDY_DATA_DIR=/app/data
      - QOSBUDDY_CHROMA_DIR=/app/chroma_store
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ../data:/app/data:ro
      - chroma_store:/app/chroma_store
      - ../rag:/app/rag:ro
    depends_on:
      - ollama
    restart: "no"

  # ── 3. FastAPI backend ────────────────────────────────────────────────────
  qosbuddy-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qosbuddy-api
    command: uvicorn api.fastapi_backend:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      # data is read-write so live_log.jsonl + mlops *_live.csv outputs can be written
      - ../data:/app/data
      - chroma_store:/app/chroma_store
      - ../rag:/app/rag:ro
      - ../api:/app/api:ro
      - ../rl_agent:/app/rl_agent:ro
      - ../qos_forecast:/app/qos_forecast:ro
      - ../causal_models:/app/causal_models:ro
      - ../anomaly_models:/app/anomaly_models:ro
      - ../mlops:/app/mlops:ro
    environment:
      - QOSBUDDY_DATA_DIR=/app/data
      - QOSBUDDY_CHROMA_DIR=/app/chroma_store
      - OLLAMA_BASE_URL=http://ollama:11434
      - QOSBUDDY_PIPELINE_INTERVAL=300
      - QOSBUDDY_PIPELINE_THRESHOLD=100
      - QOSBUDDY_PIPELINE_AUTO=true
    depends_on:
      kb-builder:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # FIX: wrapped in shell so a non-zero exit is properly caught
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" && echo ok"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── 4. Streamlit dashboard ────────────────────────────────────────────────
  qosbuddy-dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: qosbuddy-dashboard
    ports:
      - "8501:8501"
    volumes:
      # dashboard reads *_live.csv files the API/mlops jobs drop here
      - ../data:/app/data:ro
      - chroma_store:/app/chroma_store
      - ../rag:/app/rag:ro
      - ../dashboard:/app/dashboard:ro
      - ../mlops:/app/mlops:ro
    environment:
      - QOSBUDDY_DATA_DIR=/app/data
      - QOSBUDDY_CHROMA_DIR=/app/chroma_store
      - OLLAMA_BASE_URL=http://ollama:11434
      - QOSBUDDY_API_URL=http://qosbuddy-api:8000
    depends_on:
      qosbuddy-api:
        # FIX: changed from service_healthy to service_started so the dashboard
        # is not permanently blocked when the API takes long to become healthy.
        condition: service_started
    restart: unless-stopped
    healthcheck:
      # FIX: dashboard now checks its OWN port (8501), not the API's port.
      # The API URL used inside the dashboard uses the service name, not localhost.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')\" && echo ok"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  ollama_models:
  chroma_store:
